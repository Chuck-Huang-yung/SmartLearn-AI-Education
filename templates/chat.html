<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>AI 對話區</title>
  <style>
    body { font-family: Arial; padding: 20px; }
    #chat-box {
      width: 100%;
      height: 400px;
      border: 1px solid #ccc;
      padding: 10px;
      overflow-y: scroll;
      background: #f9f9f9;
      margin-bottom: 10px;
    }
    .message {
      margin: 10px 0;
    }
    .user { color: blue; }
    .bot { color: green; }
    .input-row {
      display: flex;
      gap: 10px;
    }

    .input-area {
      position: relative;
      width: 100%;
      display: flex;
      flex-direction: column;
    }

    .quick-buttons {
      display: flex;
      gap: 5px;
      margin-bottom: 5px;
    }

    .quick-buttons button {
      padding: 4px 8px;
      font-size: 12px;
      border: 1px solid #aaa;
      background-color: #e0e0e0;
      cursor: pointer;
      border-radius: 4px;
    }

    textarea {
      width: 100%;
      padding: 10px;
      font-size: 16px;
      box-sizing: border-box;
      resize: vertical;
    }

    button.send-btn {
      padding: 10px 16px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 6px;
      background-color: #f0f0f0;
      cursor: pointer;
      height: fit-content;
      align-self: flex-end;
    }

  </style>
</head>
<body>
  <h1> AI 對話區</h1>
  <div id="chat-box"></div>
  <div class="input-row">
    <div class="input-area">
      <div class="quick-buttons">
      <button onclick="quickInsertAndSend('我想修改排程!')">我想修改排程!</button>
      <button onclick="quickInsertAndSend('我這週完成了哪些進度?')">我這週完成了哪些進度？</button>
      <button onclick="quickInsertAndSend('我這週沒完成進度，可以幫我補救嗎?')">我這週沒完成進度，可以幫我補救嗎？</button>
      <button onclick="quickInsertAndSend('我想加強某個章節，可以重排進度嗎?')">我想加強某個章節，可以重排進度嗎？</button>
    </div>
       <textarea id="userInput" placeholder="請輸入訊息..." rows="3" onkeydown="handleKey(event)"></textarea>
  </div>
    <button class="send-btn" onclick="sendMessage()">送出</button>
 </div>

  <script>
    async function sendMessage() {
      const input = document.getElementById("userInput");
      const message = input.value;
      if (!message) return;

      const chatBox = document.getElementById("chat-box");
      chatBox.innerHTML += `<div class="message user"> 你：${message}</div>`;
      input.value = "";
      input.focus();

      const response = await fetch("http://127.0.0.1:8000/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message })
      });

      const data = await response.json();
      chatBox.innerHTML += `<div class="message bot"> AI：${data.reply}</div>`;
      chatBox.scrollTop = chatBox.scrollHeight;
    }
    function handleKey(event) {
     if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
      }
    }


    function quickInsertAndSend(text) {
      const input = document.getElementById("userInput");
      input.value = text;
      sendMessage();
    }
  </script>
</body>
</html>
