<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SmartLearn 用戶中心</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>

  <body
    class="bg-blue-600 min-h-screen flex flex-col items-center text-gray-800 relative"
  >
    <div
      class="absolute top-4 left-6 flex items-center space-x-2 cursor-pointer"
      onclick="window.location.href='/main_ui'"
    >
      <span class="text-white font-semibold text-lg">SmartLearn</span>
    </div>
    <!-- 頂部用戶頭像與名稱 -->
    <div
      class="mt-10 flex flex-col items-center text-center text-white relative"
    >
      <!-- 🔹 使用者頭像區 -->
      <div class="relative flex flex-col items-center mt-8">
        <!-- 頭像 -->
        <div
          class="relative cursor-pointer group"
          onclick="document.getElementById('avatarInput').click()"
          title="點擊更換頭像"
        >
          <img
            id="user-avatar"
            class="w-28 h-28 rounded-full border-4 border-white shadow-md object-cover transition group-hover:opacity-80"
            src="/static/default_avatar.png"
            alt="使用者頭像"
          />
          <div
            id="avatar-fallback"
            class="absolute inset-0 rounded-full flex items-center justify-center bg-gray-200 text-gray-400 text-3xl hidden"
          >
            👤
          </div>

          <!-- 浮動提示文字 -->
          <div
            class="absolute bottom-0 w-full text-center bg-black bg-opacity-50 text-white text-xs py-1 rounded-b-full opacity-0 group-hover:opacity-100 transition"
          >
            點擊更換頭像
          </div>
        </div>

        <!-- 隱藏上傳欄位 -->
        <input
          type="file"
          id="avatarInput"
          accept="image/*"
          class="hidden"
          onchange="handleAvatarChange(this)"
        />
      </div>
      <h1 id="user-name" class="text-2xl font-semibold mt-3">載入中...</h1>
      <p id="user-id" class="text-sm opacity-80">帳戶 ID：—</p>
    </div>

    <!-- 卡片選單 -->
    <div
      class="grid grid-cols-2 md:grid-cols-3 gap-5 mt-10 max-w-5xl w-full px-6"
    >
      <!-- 個人資料 -->
      <div
        onclick="openSection('profile')"
        class="card cursor-pointer bg-white rounded-xl p-5 shadow hover:shadow-lg transition"
      >
        <div class="flex items-center gap-3">
          <div
            class="w-10 h-10 bg-blue-100 text-blue-600 flex items-center justify-center rounded-lg"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="2"
              stroke="currentColor"
              class="w-6 h-6"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M12 12c2.21 0 4-1.79 4-4S14.21 4 12 4 8 5.79 8 8s1.79 4 4 4zm0 2c-2.67 
                0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"
              />
            </svg>
          </div>
          <div>
            <h2 class="font-semibold text-gray-800">個人資料</h2>
            <p class="text-sm text-gray-500">查看與修改您的個人介紹與興趣</p>
          </div>
        </div>
      </div>

      <!-- 帳戶資訊 -->
      <div
        onclick="openSection('account')"
        class="card cursor-pointer bg-white rounded-xl p-5 shadow hover:shadow-lg transition"
      >
        <div class="flex items-center gap-3">
          <div
            class="w-10 h-10 bg-green-100 text-green-600 flex items-center justify-center rounded-lg"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="2"
              stroke="currentColor"
              class="w-6 h-6"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M12 14l9-5-9-5-9 5 9 5z"
              />
            </svg>
          </div>
          <div>
            <h2 class="font-semibold text-gray-800">帳戶資訊</h2>
            <p class="text-sm text-gray-500">查看登入與註冊資訊</p>
          </div>
        </div>
      </div>

      <!-- 重設密碼 -->
      <div
        onclick="openSection('password')"
        class="card cursor-pointer bg-white rounded-xl p-5 shadow hover:shadow-lg transition"
      >
        <div class="flex items-center gap-3">
          <div
            class="w-10 h-10 bg-yellow-100 text-yellow-600 flex items-center justify-center rounded-lg"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="2"
              stroke="currentColor"
              class="w-6 h-6"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M12 11c.828 0 1.5-.672 1.5-1.5S12.828 8 12 8s-1.5.672-1.5 1.5S11.172 11 12 11zM6 10v10h12V10H6zm6-5a5 5 0 00-5 5v1h10v-1a5 5 0 00-5-5z"
              />
            </svg>
          </div>
          <div>
            <h2 class="font-semibold text-gray-800">重設密碼</h2>
            <p class="text-sm text-gray-500">更新您的登入密碼</p>
          </div>
        </div>
      </div>

      <!-- 興趣標籤 -->
      <div
        onclick="openSection('tags')"
        class="card cursor-pointer bg-white rounded-xl p-5 shadow hover:shadow-lg transition"
      >
        <div class="flex items-center gap-3">
          <div
            class="w-10 h-10 bg-pink-100 text-pink-600 flex items-center justify-center rounded-lg"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="2"
              stroke="currentColor"
              class="w-6 h-6"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M3 7l9 9 9-9M5 9l7 7 7-7"
              />
            </svg>
          </div>
          <div>
            <h2 class="font-semibold text-gray-800">興趣標籤</h2>
            <p class="text-sm text-gray-500">管理或找出您的學習興趣</p>
          </div>
        </div>
      </div>

      <!-- 個人名片預覽 -->
      <div
        onclick="openSection('cardPreview')"
        class="card cursor-pointer bg-white rounded-xl p-5 shadow hover:shadow-lg transition"
      >
        <div class="flex items-center gap-3">
          <div
            class="w-10 h-10 bg-purple-100 text-purple-600 flex items-center justify-center rounded-lg"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="2"
              stroke="currentColor"
              class="w-6 h-6"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M5 13l4 4L19 7M12 20h9"
              />
            </svg>
          </div>
          <div>
            <h2 class="font-semibold text-gray-800">個人名片預覽</h2>
            <p class="text-sm text-gray-500">看看好友看到您的資料樣式</p>
          </div>
        </div>
      </div>

      <!-- 上線狀態設定 -->
      <div
        onclick="openSection('status')"
        class="card cursor-pointer bg-white rounded-xl p-5 shadow hover:shadow-lg transition"
      >
        <div class="flex items-center gap-3">
          <div
            class="w-10 h-10 bg-cyan-100 text-cyan-600 flex items-center justify-center rounded-lg"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="2"
              stroke="currentColor"
              class="w-6 h-6"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M4 6h8M4 10h8M4 14h4"
              />
            </svg>
          </div>
          <div>
            <h2 class="font-semibold text-gray-800">上線狀態設定</h2>
            <p class="text-sm text-gray-500">切換您的線上 / 離線狀態</p>
          </div>
        </div>
      </div>
    </div>

    <!-- ✅ 返回主頁按鈕 -->
    <button
      onclick="window.location.href='/main_ui'"
      class="mt-12 mb-6 bg-white text-blue-600 font-semibold px-6 py-2 rounded-full shadow hover:bg-blue-100 transition"
    >
      ← 返回主頁
    </button>

    <!-- 彈出詳細資訊 -->
    <div
      id="sectionModal"
      class="fixed inset-0 bg-black/60 hidden items-center justify-center z-50"
    >
      <div class="bg-white rounded-2xl shadow-lg w-[90%] max-w-xl p-6 relative">
        <button
          onclick="closeModal()"
          class="absolute top-4 right-4 text-gray-400 hover:text-gray-600"
        >
          ✕
        </button>
        <div id="sectionContent"></div>
      </div>
    </div>

    <div
      id="avatarModal"
      class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50"
    >
      <div class="bg-white rounded-xl shadow-lg w-80 p-6 text-center">
        <h2 class="text-xl font-semibold text-gray-800 mb-4">上傳新頭像</h2>

        <!-- 預覽 -->
        <img
          id="avatarPreview"
          class="w-28 h-28 rounded-full mx-auto border border-gray-300 object-cover mb-4"
          src="/static/default_avatar.png"
          alt="預覽圖片"
        />

        <!-- 檔案輸入 -->
        <input
          id="avatarFileInput"
          type="file"
          accept="image/*"
          class="block mx-auto mb-4"
        />

        <!-- 按鈕 -->
        <div class="flex justify-center gap-3 mt-4">
          <button
            onclick="closeAvatarModal()"
            class="px-4 py-2 bg-gray-300 rounded-lg hover:bg-gray-400 transition"
          >
            取消
          </button>
          <button
            onclick="confirmUploadAvatar()"
            class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition"
          >
            確認上傳
          </button>
        </div>
      </div>
    </div>

    <script src="/個人資訊/myself.js"></script>
  </body>
</html>
